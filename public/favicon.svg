<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E3A8A" />
      <stop offset="100%" stopColor="#000000" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#A1A1AA" />
    </linearGradient>
  </defs>
  
  <!-- Premium Dark Rounded Square Background -->
  <rect width="100" height="100" rx="24" fill="url(#skyGrad)" />
  
  <!-- Minimalist Cloud Graphic -->
  <path 
    d="M 28 65 
       C 22 65, 18 60, 18 54 
       C 18 48, 22 43, 28 43
       C 30 33, 38 25, 48 25
       C 58 25, 66 33, 68 43
       C 76 43, 82 48, 82 56
       C 82 64, 76 69, 68 69
       Z" 
    fill="url(#cloudGrad)" 
    filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.4))"
  />
  
  <!-- Sleek Sun/Moon Accent -->
  <circle cx="65" cy="35" r="12" fill="#FBBF24" filter="drop-shadow(0px 0px 8px rgba(251,191,36,0.6))" />
</svg>